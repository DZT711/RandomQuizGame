<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Master</title>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Custom Animations */
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .answer-btn {
            transition: all 0.2s ease;
        }
        .answer-btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex flex-col items-center justify-center p-4 text-gray-800 font-sans">

    <!-- Main Game Card -->
    <div id="game-container" class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-2xl p-6 md:p-10 max-w-xl w-full text-center relative overflow-hidden">
        
        <!-- Header -->
        <div class="mb-6 flex justify-between items-center pb-4 border-b border-gray-200 hidden" id="game-header">
            <div class="text-sm font-bold text-indigo-600 bg-indigo-100 px-3 py-1 rounded-full">
                Question <span id="current-q-num">1</span>/<span id="total-q-num">10</span>
            </div>
            <div class="text-sm font-bold text-green-600 bg-green-100 px-3 py-1 rounded-full">
                Score: <span id="score-display">0</span>
            </div>
        </div>

        <!-- Dynamic Content Area -->
        <div id="app-content" class="fade-in min-h-[250px] flex flex-col justify-center">
            <!-- Content will be injected here via JS -->
        </div>

    </div>

    <script>
        // --- GAME STATE ---
        const API_URL = 'https://opentdb.com/api.php?amount=10&type=multiple';
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;

        // --- DOM ELEMENTS ---
        const appContent = document.getElementById('app-content');
        const gameHeader = document.getElementById('game-header');
        const currentQNum = document.getElementById('current-q-num');
        const totalQNum = document.getElementById('total-q-num');
        const scoreDisplay = document.getElementById('score-display');

        // --- UTILITY FUNCTIONS ---
        
        // The API returns HTML entities (like &quot;), this decodes them to normal text
        function decodeHTML(html) {
            const txt = document.createElement("textarea");
            txt.innerHTML = html;
            return txt.value;
        }

        // Shuffle array elements (Fisher-Yates algorithm)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // --- GAME SCREENS ---

        function renderStartScreen() {
            gameHeader.classList.add('hidden');
            appContent.innerHTML = `
                <div class="fade-in">
                    <i class="fa-solid fa-brain text-6xl text-indigo-500 mb-4"></i>
                    <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-pink-500 mb-2">Trivia Master</h1>
                    <p class="text-gray-500 mb-8">Test your knowledge with 10 random questions from around the world!</p>
                    <button onclick="fetchQuestions()" class="bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 text-lg w-full sm:w-auto">
                        <i class="fa-solid fa-play mr-2"></i> Start Quiz
                    </button>
                </div>
            `;
        }

        function renderLoadingScreen() {
            appContent.innerHTML = `
                <div class="fade-in py-10">
                    <div class="loader mb-4"></div>
                    <h2 class="text-xl font-semibold text-gray-700">Gathering questions...</h2>
                    <p class="text-sm text-gray-500 mt-2">Connecting to Open Trivia Database</p>
                </div>
            `;
        }

        async function fetchQuestions() {
            renderLoadingScreen();
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    questions = data.results;
                    startGame();
                } else {
                    throw new Error("No questions found");
                }
            } catch (error) {
                appContent.innerHTML = `
                    <div class="fade-in text-red-500">
                        <i class="fa-solid fa-triangle-exclamation text-5xl mb-4"></i>
                        <h2 class="text-2xl font-bold mb-2">Oops! Connection Error</h2>
                        <p class="mb-6 text-gray-600">Failed to fetch questions. Please check your internet and try again.</p>
                        <button onclick="fetchQuestions()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-6 rounded-full">Try Again</button>
                    </div>
                `;
            }
        }

        function startGame() {
            score = 0;
            currentQuestionIndex = 0;
            gameHeader.classList.remove('hidden');
            totalQNum.innerText = questions.length;
            updateHeader();
            renderQuestion();
        }

        function updateHeader() {
            currentQNum.innerText = currentQuestionIndex + 1;
            scoreDisplay.innerText = score;
        }

        function renderQuestion() {
            const currentQ = questions[currentQuestionIndex];
            
            // Format question and answers
            const questionText = decodeHTML(currentQ.question);
            const correctAnswer = decodeHTML(currentQ.correct_answer);
            const incorrectAnswers = currentQ.incorrect_answers.map(ans => decodeHTML(ans));
            
            // Combine and shuffle answers
            let allAnswers = [...incorrectAnswers, correctAnswer];
            allAnswers = shuffleArray(allAnswers);

            // Build answers HTML
            const answersHTML = allAnswers.map(answer => `
                <button onclick="handleAnswer(this, '${escape(answer)}', '${escape(correctAnswer)}')" 
                        class="answer-btn w-full text-left bg-gray-50 hover:bg-indigo-50 border-2 border-gray-200 hover:border-indigo-300 text-gray-700 font-medium py-3 px-5 rounded-xl mb-3 focus:outline-none">
                    ${answer}
                </button>
            `).join('');

            // Category and Difficulty tags
            let difficultyColor = currentQ.difficulty === 'hard' ? 'text-red-600 bg-red-100' : 
                                  currentQ.difficulty === 'medium' ? 'text-yellow-600 bg-yellow-100' : 
                                  'text-green-600 bg-green-100';

            appContent.innerHTML = `
                <div class="fade-in text-left">
                    <div class="flex gap-2 mb-4 text-xs font-bold uppercase tracking-wider">
                        <span class="px-2 py-1 bg-gray-100 text-gray-500 rounded">${decodeHTML(currentQ.category)}</span>
                        <span class="px-2 py-1 rounded ${difficultyColor}">${currentQ.difficulty}</span>
                    </div>
                    <h2 class="text-xl md:text-2xl font-bold text-gray-800 mb-6 leading-relaxed">${questionText}</h2>
                    <div id="answers-container" class="flex flex-col">
                        ${answersHTML}
                    </div>
                    <div id="next-btn-container" class="mt-6 text-right hidden">
                        <button onclick="nextQuestion()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-lg shadow transition">
                            Next Question <i class="fa-solid fa-arrow-right ml-1"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        // We use escape/unescape to safely pass strings with quotes via inline onclick handlers
        function handleAnswer(buttonElement, selectedEscaped, correctEscaped) {
            const selectedAnswer = unescape(selectedEscaped);
            const correctAnswer = unescape(correctEscaped);
            
            const isCorrect = selectedAnswer === correctAnswer;
            const allButtons = document.querySelectorAll('.answer-btn');

            // Disable all buttons to prevent multiple clicks
            allButtons.forEach(btn => {
                btn.disabled = true;
                btn.classList.remove('hover:bg-indigo-50', 'hover:border-indigo-300', 'cursor-pointer');
                
                // Highlight the correct answer automatically
                if (btn.innerText.trim() === correctAnswer) {
                    btn.classList.remove('bg-gray-50', 'border-gray-200');
                    btn.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                    btn.innerHTML += ' <i class="fa-solid fa-circle-check float-right text-xl mt-0.5"></i>';
                }
            });

            // Handle the button the user actually clicked
            if (isCorrect) {
                score += 10; // Award 10 points per correct answer
                updateHeader();
                triggerConfetti(buttonElement);
            } else {
                buttonElement.classList.remove('bg-gray-50', 'border-gray-200');
                buttonElement.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                buttonElement.innerHTML += ' <i class="fa-solid fa-circle-xmark float-right text-xl mt-0.5"></i>';
            }

            // Show next button
            document.getElementById('next-btn-container').classList.remove('hidden');
            document.getElementById('next-btn-container').classList.add('fade-in');
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                updateHeader();
                renderQuestion();
            } else {
                renderEndScreen();
            }
        }

        function renderEndScreen() {
            gameHeader.classList.add('hidden');
            const maxScore = questions.length * 10;
            const percentage = (score / maxScore) * 100;
            
            let message = "";
            let icon = "";
            let color = "";

            if (percentage >= 80) {
                message = "Outstanding! You're a Trivia Master!";
                icon = "fa-trophy";
                color = "text-yellow-500";
            } else if (percentage >= 50) {
                message = "Good job! You know your stuff.";
                icon = "fa-thumbs-up";
                color = "text-blue-500";
            } else {
                message = "Nice try! Better luck next time.";
                icon = "fa-book-open";
                color = "text-purple-500";
            }

            appContent.innerHTML = `
                <div class="fade-in py-4">
                    <i class="fa-solid ${icon} text-7xl ${color} mb-4"></i>
                    <h2 class="text-3xl font-bold mb-2">Quiz Complete!</h2>
                    <p class="text-gray-600 mb-6">${message}</p>
                    
                    <div class="bg-gray-50 rounded-xl p-6 mb-8 border border-gray-100">
                        <div class="text-sm text-gray-500 uppercase tracking-wide mb-1">Final Score</div>
                        <div class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-pink-500">
                            ${score} <span class="text-2xl text-gray-400 font-medium">/ ${maxScore}</span>
                        </div>
                    </div>

                    <button onclick="renderStartScreen()" class="bg-gray-800 hover:bg-black text-white font-bold py-3 px-8 rounded-full shadow-lg transition w-full sm:w-auto">
                        <i class="fa-solid fa-rotate-right mr-2"></i> Play Again
                    </button>
                </div>
            `;
        }

        // Small visual flare for correct answers
        function triggerConfetti(element) {
            // A simple CSS scale bump to simulate excitement
            element.style.transform = 'scale(1.05)';
            setTimeout(() => {
                element.style.transform = 'scale(1)';
            }, 200);
        }

        // --- INIT ---
        // Initialize the app by showing the start screen
        renderStartScreen();

    </script>
</body>
</html>
